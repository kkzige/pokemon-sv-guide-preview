/* iPhone readability layer. Uses generous tap targets, high contrast and safe-area spacing. */
:root { --ui-scale:0px; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
html[data-text-size="large"] { --ui-scale:2px; }
body { overscroll-behavior-y:contain; }
button,input,select { -webkit-tap-highlight-color:transparent; }
button:focus-visible, input:focus-visible, select:focus-visible {outline:3px solid #5a85e9;outline-offset:2px;}
@media(max-width:830px) {

  .topbar {position:relative;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;}
  .topline{gap:10px; flex-wrap:wrap;}
  .appmark{width:46px;height:46px;border-radius:14px}
  .brand{font-size:calc(20px + var(--ui-scale));line-height:1.3;letter-spacing:-.02em}
  .subbrand{font-size:calc(13px + var(--ui-scale));line-height:1.5;color:#d4def0}
  .version{font-size:12px;padding:6px 8px;color:#e2eafa}

  .font-switch{background:#263957;border:1px solid #536584;color:white;border-radius:10px;padding:8px 13px;min-height:42px;font-size:calc(14px + var(--ui-scale));font-weight:750;}
  .offline-caption{font-size:calc(13px + var(--ui-scale));color:#d9e4fa;margin-right:auto;line-height:1.35}
  .mainlayout{padding:19px 14px calc(115px + env(safe-area-inset-bottom));}
  .pagehead{margin-bottom:17px}
  .pagehead .eyebrow{font-size:calc(12px + var(--ui-scale));letter-spacing:.07em}
  .pagehead h1{font-size:clamp(27px,7.7vw,36px);letter-spacing:-.03em;margin:7px 0 10px;line-height:1.22}
  .pagehead p{font-size:calc(16px + var(--ui-scale));line-height:1.65;color:#4e6078}
  .panel{padding:19px 16px;border-radius:17px;margin-bottom:14px;border-color:#dfe5ee;box-shadow:0 5px 18px rgba(26,42,71,.035)}
  .paneltop{margin-bottom:14px;flex-wrap:wrap;gap:8px}

  .subtle-title{font-size:calc(17px + var(--ui-scale));color:#263a57;margin-top:9px}

  .tiny,.small,.tag,.chip,.ghosttype,.facts,.status,.footer,.checklabel {font-size:calc(13px + var(--ui-scale));line-height:1.5}
  input,select,button{font-size:calc(17px + var(--ui-scale));}
  input, select{padding:13px 12px; min-height:49px;line-height:1.35;border-color:#cbd5e4;border-radius:12px;}
  .btn{padding:11px 15px;min-height:48px;font-size:calc(16px + var(--ui-scale));border-radius:12px;}
  .btn.small{min-height:43px;font-size:calc(14px + var(--ui-scale));padding:10px 12px;white-space:normal;}
  .exbtn{min-height:45px;font-size:calc(14px + var(--ui-scale));line-height:1.32;padding:11px 13px;background:#edf2fa;color:#344967}

  .tag{padding:6px 10px;color:#415773}

  .facts{gap:11px;font-size:calc(14px + var(--ui-scale));}

  .explain h3{font-size:calc(17px + var(--ui-scale));line-height:1.5}
  .results{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

  .base-row{font-size:calc(14px + var(--ui-scale));grid-template-columns:48px 1fr 40px;gap:7px}

  .ranktext{font-size:calc(15px + var(--ui-scale));line-height:1.5}

.suggestion span:last-child{font-size:13px;flex-shrink:0}
.suggestion:active,.suggestion:focus-visible{background:#e8efff;outline:2px solid #5274d8;outline-offset:-2px}
@media(max-width:440px){.suggestion{min-height:56px;padding:13px 12px}.suggestion span:last-child{font-size:12px}}

/* V1.2.1-preview: visible data readiness and safer mobile typing/taps */
.data-ready{background:#eaf7f1;border:1px solid #b9e3cc;color:#126249;font-size:14px;line-height:1.6;border-radius:12px;padding:11px 14px;margin:0 0 14px;font-weight:650}
.suggestions{z-index:120;max-height:min(42dvh,370px);-webkit-overflow-scrolling:touch}
.suggestion{min-height:54px;touch-action:manipulation}
@media(max-width:830px){.data-ready{font-size:15px}.suggestion{min-height:60px}.suggestions{max-height:min(38dvh,330px)}.suggestion span:last-child{overflow:hidden;max-width:48%;text-overflow:ellipsis}}

function roundText(n) { return n===0?'无效 ×0':n===0.25?'¼倍':n===0.5?'½倍':n===1?'1倍':n===2?'2倍':n===4?'4倍':`${Number(n.toFixed(3))}倍`; }
function typeFactor(attackType, defenderTypes) { return (defenderTypes||[]).reduce((p,t)=>p*(CHART[attackType]?.[t]??1),1); }
function effectiveness(attackType, naturalTypes, tera='none', ability='', item='', ignoreAbility=false) {
  const currentTypes=(tera&&tera!=='none'&&tera!=='stellar')?[tera]:naturalTypes;
  const base=typeFactor(attackType,currentTypes);
  let value=base;
  const notes=[];
  if(tera==='stellar')notes.push('星晶太晶防守仍以原本属性计算；这里只计算普通属性相性。');
  if(tera!=='none'&&tera!=='stellar')notes.push('太晶化后防御仅按'+TYPE_NAME[tera]+'属性计算。');
  const immunities={
    'water-absorb':'water','storm-drain':'water','dry-skin':'water',
    'volt-absorb':'electric','lightning-rod':'electric','motor-drive':'electric',
    'levitate':'ground','earth-eater':'ground','flash-fire':'fire',
    'well-baked-body':'fire','sap-sipper':'grass'
  };
  if(!ignoreAbility && ability && immunities[ability]===attackType){
    value=0;
    const extra={
      'water-absorb':'通常恢复自身最大HP的¼','storm-drain':'通常提升特攻','dry-skin':'通常恢复自身最大HP的¼',
      'volt-absorb':'通常恢复自身最大HP的¼','lightning-rod':'通常提升特攻','motor-drive':'通常提升速度',
      'earth-eater':'通常恢复自身最大HP的¼','flash-fire':'通常强化自己的火属性攻击',
      'well-baked-body':'通常大幅提升防御','sap-sipper':'通常提升攻击'
    };
    notes.push(`${ABILITY_NAME[ability]||ability}特性：免疫${TYPE_NAME[attackType]}属性招式；${extra[ability]||'触发附加效果'}。`);
  }
  if(!ignoreAbility && ability==='wonder-guard' && base<=1){ value=0; notes.push('神奇守护：通常只有效果绝佳的攻击招式才能命中。'); }
  if(!ignoreAbility && ability==='thick-fat' && ['fire','ice'].includes(attackType)){value*=.5; notes.push('厚脂肪：火、冰属性招式伤害减半。');}
  if(!ignoreAbility && ability==='heatproof' && attackType==='fire'){value*=.5; notes.push('耐热：火属性招式伤害减半。');}
  if(!ignoreAbility && ability==='purifying-salt' && attackType==='ghost'){value*=.5; notes.push('洁净之盐：幽灵属性招式伤害减半。');}
  if(!ignoreAbility && ability==='dry-skin' && attackType==='fire'){value*=1.25; notes.push('干燥皮肤：受到的火属性招式伤害增加25%。');}
  if(!ignoreAbility && ['filter','solid-rock','prism-armor'].includes(ability) && base>1){value*=.75; notes.push((ABILITY_NAME[ability]||ability)+'：效果绝佳的伤害通常减少25%。');}
  if(item==='air-balloon'&&attackType==='ground'&&value!==0){value=0;notes.push('气球道具：未破裂前，通常免疫地面属性招式。');}
  if(ignoreAbility && ability)notes.push('已选择忽略防守方特性；实际能否无视特性取决于具体招式、特性与机制。');
  if(base===0)notes.unshift('防御属性本身对该攻击属性免疫。');
  return {value,base,types:currentTypes,notes};
}
function offenseList(poke, tera='none', ability='', item='', ignoreAbility=false) {

    .sort((a,b)=>b.value-a.value||TYPES.findIndex(x=>x[0]===a.id)-TYPES.findIndex(x=>x[0]===b.id));
}
function statValue(base,iv=31,ev=0,level=50,natureId='hardy',stat='hp') {
  const l=Math.min(100,Math.max(1,Number(level)||50));
  const v=Math.min(31,Math.max(0,Number(iv)||0));
  const e=Math.min(252,Math.max(0,Number(ev)||0));
  if(stat==='hp')return Math.floor((2*base+v+Math.floor(e/4))*l/100)+l+10;
  const n=NATURES.find(x=>x[0]===natureId)||NATURES[0];
  const factor=n[2]===stat?1.1:n[3]===stat?.9:1;
  return Math.floor((Math.floor((2*base+v+Math.floor(e/4))*l/100)+5)*factor);
}
function buildStats(poke,{iv={},ev={},level=50,nature='hardy'}={}) {
  return Object.fromEntries(STAT_KEYS.map((k,i)=>[k,statValue(poke.stats[i],iv[k]??31,ev[k]??0,level,nature,k)]));
}
function evPlan(poke,mode='raid'){
  // Deliberately simple transparent heuristic; actual builds require matchup and learned-move verification.
  if(!poke?.stats)return null;
  const isAzumarill=poke.en==='azumarill';
  const physical=isAzumarill || (poke.stats[1] > poke.stats[3]);
  const focus=physical?'atk':'spa';
  const ev={hp:0,atk:0,def:0,spa:0,spd:0,spe:0};
  ev[focus]=252;
  if(mode==='raid') {ev.hp=252;ev[poke.stats[2]<poke.stats[4]?'def':'spd']=4;}
  else {ev.spe=252;ev.hp=4;}
  const nature=physical?'adamant':'modest';
  let explanation=mode==='raid'?'团体战通常重视持续作战：优先输出＋HP。':'通关通常重视输出和先手：优先输出＋速度。';
  if(poke.en==='azumarill')explanation+=' 大力士让玛力露丽更适合物理攻击；可考虑腹鼓，但不能无脑用于所有高星团体战。';
  if(mode==='story'&&poke.stats[5]<65)explanation+=' 注意：该宝可梦速度种族值偏低，投入速度后也可能无法先手。';
  return {ev,nature,focus,physical,explanation,role:physical?'物理输出型':'特殊输出型',teraCandidates:poke.types.slice()};
}
function trainingItems(current,target) {
  const need=Math.max(0,target-current);
  const remove=Math.max(0,current-target);
  const vitamins=Math.min(25,Math.floor(need/10));
  const feathers=need-vitamins*10;
  const powerBattles=Math.ceil(need/9);
  return {need,remove,vitamins,feathers,powerBattles};
}
function stab(attackType,ownerTypes=[],tera='none') {
  if(tera==='stellar')return ownerTypes.includes(attackType)?2:1.2; // Simplified ordinary-move first-use Stellar approximation; special constraints below.
  if(tera && tera!=='none' && attackType===tera)return ownerTypes.includes(attackType)?2:1.5;
  if(ownerTypes.includes(attackType))return 1.5;
  return 1;
}
function moveScore(move,owner,foe,tera='none',foeTera='none',foeAbility='',foeItem='',ignoreAbility=false) {
  if(!move || move.category==='status' || !move.power) return null;
  const match=effectiveness(move.type,foe.types,foeTera,foeAbility,foeItem,ignoreAbility);
  const ownStats=owner.stats||[50,50,50,50,50,50];
  const offense=move.category==='physical'?ownStats[1]:ownStats[3];
  // A rough ranking, not the game's damage formula; excludes opponent defense, weather, etc.
  return {match,stab:stab(move.type,owner.types,tera),score:Math.round(move.power*(move.accuracy||100)/100*match.value*stab(move.type,owner.types,tera)*offense/100)};
}
function suggestTypes(results){const max=Math.max(...results.map(x=>x.value)); return results.filter(x=>x.value===max);}

// Build-time generated, first-party offline data. Read-only snapshot; no network queries to PokeAPI on a normal lookup.
let SV_SNAPSHOT=null;
let SV_SNAPSHOT_ERROR='';
const SV_POKEMON_BY_NAME=new Map(),SV_POKEMON_BY_ID=new Map();
const SV_DIRECTORY_BY_NAME=new Map();
const SV_ABILITY_ZH=new Map();
async function initSVSnapshot(){
 if(SV_SNAPSHOT)return SV_SNAPSHOT.coverage;
 try{
  // iOS Safari and standalone PWAs can fail a secondary fetch even when the page
  // itself loads. The preview build embeds the verified data as inert JSON.
  // Prefer that same-origin, build-time payload, then fall back to the JSON file.
  let data;
  const inline=typeof document!=='undefined'?document.getElementById('sv-offline-snapshot'):null;
  if(inline?.textContent?.trim()){
    data=JSON.parse(inline.textContent);
  }else{
    const res=await fetch('./sv-data.json',{cache:'default'});
    if(!res.ok)throw new Error(`离线快照未发布 HTTP ${res.status}`);
    data=await res.json();
  }
  if(data.schema!==1 || !Array.isArray(data.pokemon) || data.pokemon.length<500 || !data.breedingIndex?.length || Object.keys(data.moves||{}).length<350)
    throw new Error('资料快照不完整，已阻止加载');
  SV_SNAPSHOT=data;
  for(const p of data.pokemon){
   SV_POKEMON_BY_NAME.set(p.en.toLowerCase(),p);
   const old=SV_POKEMON_BY_ID.get(p.id);
   if(!old||(!old.isDefault&&p.isDefault))SV_POKEMON_BY_ID.set(p.id,p);
  }
  for(const p of data.directory){SV_DIRECTORY_BY_NAME.set(p.zh.toLowerCase(),p);}
  for(const a of data.abilityIndex||[])SV_ABILITY_ZH.set(a.id,a.zh);
  SV_SNAPSHOT_ERROR='';
  return data.coverage;
 }catch(error){SV_SNAPSHOT_ERROR=String(error.message||error);return null;}
}
const getSVSnapshot=()=>SV_SNAPSHOT;
const getSVSnapshotError=()=>SV_SNAPSHOT_ERROR;
const getSVSnapshotStats=()=>SV_SNAPSHOT?.coverage||null;

const getSVBreedingIndex=()=>SV_SNAPSHOT?.breedingIndex||null;
const getSVMoves=()=>SV_SNAPSHOT?.moves||null;
const getSVReferenceIndex=kind=>kind==='abilities'?SV_SNAPSHOT?.abilityIndex||null:kind==='items'?SV_SNAPSHOT?.itemIndex||null:null;
function getSVPokemon(q){
 const s=String(q??'').trim().toLowerCase();if(!s||!SV_SNAPSHOT)return null;
 const p=SV_POKEMON_BY_NAME.get(s)||SV_POKEMON_BY_ID.get(Number(s))||(()=>{const entry=SV_DIRECTORY_BY_NAME.get(s);return entry?SV_POKEMON_BY_NAME.get(entry.en):null;})();
 return p?{...p,origin:'sv-snapshot',evolution:'本地已含进化家族索引；特殊进化条件仍需结合专项资料核对。',svMoves:p.moves.length}:null;
}

const getSVAbilityName=id=>SV_ABILITY_ZH.get(id)||null;
function getSVFamily(p){
 if(!SV_SNAPSHOT||!p?.baseEn)return null;
 const related=SV_SNAPSHOT.breedingIndex.filter(x=>x.baseEn===p.baseEn);
 if(!related.length)return null;
 const nodes=new Map(related.map(x=>[x.en,x]));
 const children=new Map();
 for(const x of related){if(x.evolvesFrom&&nodes.has(x.evolvesFrom)){
   if(!children.has(x.evolvesFrom))children.set(x.evolvesFrom,[]);
   children.get(x.evolvesFrom).push(x.en);
 }}
 const root=nodes.get(p.baseEn)||related[0];
 const paths=[];
 function walk(en,path,visited=new Set()){
   if(visited.has(en)||path.length>6)return;
   const node=nodes.get(en);if(!node)return;
   const current=[...path,{en:node.en,zh:node.zh,via:path.length?'具体进化条件请查看特殊进化速查／在线核对':''}];
   const next=(children.get(en)||[]).sort();
   if(!next.length){paths.push(current);return;}
   for(const child of next)walk(child,current,new Set([...visited,en]));
 }
 walk(root.en,[]);
 if(!paths.length)return null;
 const currentSpecies=p.speciesEn||p.en;
 const stages=paths.flatMap(path=>path.map((x,i)=>x.en===currentSpecies?i+1:null).filter(Boolean));
 return {id:root.en,paths,stage:stages[0]||1,maxStages:Math.max(...paths.map(x=>x.length)),verified:'sv-index',
   note:'离线进化家族结构来自跨世代物种关系；具体进化触发条件、地区形态、朱紫可获得性并未全部核实。'};
}

    if(d.min_happiness)parts.push('高亲密度');
    if(d.time_of_day)parts.push(d.time_of_day==='night'?'夜间':d.time_of_day==='day'?'白天':d.time_of_day);
    if(d.item)parts.push(`使用 ${d.item.name}`);

    if(d.known_move)parts.push(`学会 ${d.known_move.name}`);
    if(d.known_move_type)parts.push(`学会${TYPE_NAME[d.known_move_type.name]||d.known_move_type.name}属性招式`);

 const notes=[];
 if(abilities.includes('huge-power'))notes.push('大力士会提高实际物理输出，不能只看攻击种族值。');

 if(hp>=100&&Math.max(def,spd)>=90)notes.push('具备较好的耐久基础，可考虑团体战持久战路线。');
 notes.push('这只是数值结构评定，不是综合强度排名；特性、招式、形态与对战环境同样重要。');
 return {total,band,offensive,highlights,notes};

 return {current,total,available,wanted,feasible:wanted<=available,reachable:current+Math.min(wanted,available)};

   ...x,stat,target:Number(target),item,method,delta,perBattle,battles,featherFinish,
   vitamins:Math.floor(delta/10),vitaminFeathers:delta%10,

 const plan=calculateTraining(ev,stat,target,method);
 const increments={battle:plan.perBattle,vitamin:10,feather:1};
 if(!(action in increments))return {ok:false,reason:'未知训练项目'};
 if(plan.wanted===0)return {ok:false,reason:'当前已经达到或超过目标；不需要继续增加该项努力值。'};
 if(!plan.feasible)return {ok:false,reason:'总努力值剩余空间不足，无法达到目标；请先调整或降低其他项目。'};
 let gain=Math.min(increments[action],plan.available);
 if(gain<=0)return {ok:false,reason:'已经达到努力值上限。'};
 // Values are capped by the game only at 252/stat or 510/total, never by arbitrary user-set target.
 if(plan.current+gain>plan.target)return {ok:false,reason:'这项训练会超过你设定的目标值。可改用羽毛精确补足，或在游戏中重新规划。'};
 return {ok:true,gain,ev:{...ev,[stat]:plan.current+gain},method:action};
}

const recommendedFor=(mode='story',type='all',role='all')=>CURATED_BUILDS.filter(b=>b.mode===mode&&byName[b.pokemon]&&(type==='all'||byName[b.pokemon].types.includes(type))&&(role==='all'||b.roles.includes(role))).sort((a,b)=>'SAB'.indexOf(a.tier)-'SAB'.indexOf(b.tier)||a.pokemon.localeCompare(b.pokemon,'zh-CN'));
function teamWeaknesses(team){const members=team.members.map(n=>byName[n]).filter(Boolean);return TYPES.map(([t,zh])=>({type:t,zh,count:members.filter(p=>typeFactor(t,p.types)>=2).length})).filter(x=>x.count>=3).sort((a,b)=>b.count-a.count||a.zh.localeCompare(b.zh,'zh-CN'));}
function validateRecommendedData(){const issues=[];for(const b of CURATED_BUILDS){const p=byName[b.pokemon];if(!p){issues.push(`${b.pokemon}: 不在内置图鉴`);continue;}if(b.moves.length>4||b.moves.length<1)issues.push(`${b.pokemon}: 招式数错误`);for(const m of b.moves){if(!p.moves.includes(m))issues.push(`${b.pokemon}: ${m}不在内置可学示例列表`);}if(!['S','A','B'].includes(b.tier))issues.push(`${b.pokemon}: 梯级无效`);}for(const team of CURATED_TEAMS){if(new Set(team.members).size!==team.members.length)issues.push(`队伍${team.id}重复成员`);for(const n of team.members){if(!byName[n])issues.push(`队伍${team.id}: ${n}不在离线图鉴`);}if(team.mode==='story'&&team.members.length!==6)issues.push(`队伍${team.id}: 主线队成员不足六只`);}return issues;}

// V0.9 个人队伍分析：只使用本地物种属性和已经收录的精选配置。
// 注意：这是静态属性分析，不模拟速度线、天气、对局胜率或实际合法招式的全部范围。



const TEAM_BY_NAME=new Map(BUILTIN.map(p=>[p.zh,p]));
function registerTeamPokemon(p){
 if(p?.zh&&Array.isArray(p.types)&&p.types.length&&Array.isArray(p.stats)&&p.stats.length===6){TEAM_BY_NAME.set(p.zh,p);return true;}return false;
}
const hasTeamPokemon=name=>TEAM_BY_NAME.has(name);

const unique=xs=>[...new Set(xs)];
const scoreChoice=tier=>({S:3,A:2,B:1})[tier]||0;
const SAMPLE_TEAM=['骨纹巨声鳄','玛力露丽','电肚蛙','烈咬陆鲨','巨锻匠','土王'];
function teamSnapshot(names,mode='story'){
 const raw=Array.isArray(names)?names.slice(0,6):[];
 const known=raw.map(n=>TEAM_BY_NAME.get(n)||null);
 const members=known.filter(Boolean);
 const duplicates=unique(members.map(p=>p.zh).filter((n,i,a)=>a.indexOf(n)!==i));
 const unknown=raw.filter(n=>n&&!TEAM_BY_NAME.has(n));
 const validMembers=unique(members.map(p=>p.zh)).map(n=>TEAM_BY_NAME.get(n));
 const weaknesses=TYPES.map(([type,zh])=>({type,zh,victims:validMembers.filter(p=>typeFactor(type,p.types)>1).map(p=>({name:p.zh,factor:typeFactor(type,p.types)})),resists:validMembers.filter(p=>typeFactor(type,p.types)<1).map(p=>p.zh)}));
 // 理论同属性攻击覆盖：假设成员有对应属性的攻击招式，并不承诺已学或可学。
 const offensive=TYPES.map(([type,zh])=>({type,zh,best:validMembers.reduce((best,p)=>{
  const bestType=p.types.reduce((v,t)=>Math.max(v,typeFactor(t,[type])),0);
  return bestType>best.factor?{name:p.zh,attackTypes:p.types.filter(t=>typeFactor(t,[type])===bestType),factor:bestType}:best;
 },{name:'',attackTypes:[],factor:0})}));
 const sharedWeaknesses=weaknesses.filter(w=>w.victims.length>=2).sort((a,b)=>b.victims.length-a.victims.length);
 const weakClusters=sharedWeaknesses.filter(w=>w.victims.length>=3);
 const missingOffense=offensive.filter(x=>x.best.factor<2);
 const builds=validMembers.map(p=>({name:p.zh,set:CURATED_BUILDS.find(b=>b.pokemon===p.zh&&b.mode===mode)||null}));
 const roles=unique(builds.flatMap(x=>x.set?.roles||[]));
 const offenseSkills=unique(builds.flatMap(x=>(x.set?.moves||[]).map(m=>COMMON_MOVES[m]?.type).filter(Boolean)));
 const specialty=validMembers.map(p=>{
  const atk=p.stats?.[1]||0,spa=p.stats?.[3]||0;
  return {name:p.zh,physical:atk>spa+15,special:spa>atk+15,balanced:Math.abs(atk-spa)<=15};
 });
 const summary={size:validMembers.length,duplicates,unknown,sharedWeaknesses,weakClusters,missingOffense,roles,offenseSkills,hasPhysical:specialty.some(x=>x.physical),hasSpecial:specialty.some(x=>x.special)};
 return {members:validMembers,weaknesses,offensive,builds,summary};
}
function penalty(s){return s.weaknesses.reduce((sum,x)=>sum+Math.max(0,x.victims.length-2)*2+(x.victims.length>=4?2:0),0);}
function cover(s){return s.offensive.filter(x=>x.best.factor>=2).length;}
function candidateChanges(names,mode='story',limit=5){
 const before=teamSnapshot(names,mode),existing=new Set(before.members.map(p=>p.zh));
 if(before.members.length<2)return [];
 const result=[];
 for(let slot=0;slot<Math.min(6,names.length);slot++){
  const old=TEAM_BY_NAME.get(names[slot]);if(!old)continue;
  for(const b of CURATED_BUILDS.filter(x=>x.mode===mode&&scoreChoice(x.tier)>=2&&!existing.has(x.pokemon))){
   if(!TEAM_BY_NAME.has(b.pokemon))continue;
   const next=names.slice(0,6);next[slot]=b.pokemon;
   const after=teamSnapshot(next,mode);
   const fewer=penalty(before)-penalty(after),coverage=cover(after)-cover(before);
   const roleGap=b.roles.filter(r=>!before.summary.roles.includes(r)).length;
   const score=fewer*2+coverage*2+roleGap*2;
   if(score>0)result.push({from:old.zh,to:b.pokemon,score,coverageDelta:coverage,clusterDelta:before.summary.weakClusters.length-after.summary.weakClusters.length,roles:b.roles,tier:b.tier,reason:b.reason});
  }
 }
 return result.sort((a,b)=>b.score-a.score||scoreChoice(b.tier)-scoreChoice(a.tier)||a.to.localeCompare(b.to,'zh-CN')).slice(0,limit);
}
function teamMoveHints(names,mode='story'){
 return unique((names||[]).filter(Boolean)).flatMap(name=>{
  const b=CURATED_BUILDS.find(x=>x.mode===mode&&x.pokemon===name);
  return b?[{name,moves:b.moves.map(id=>({id,label:COMMON_MOVES[id]?.zh||id,type:COMMON_MOVES[id]?.type||null})),tera:b.tera,nature:b.nature,ev:b.ev,caution:b.caution,availability:b.availability}]:[];
 });
}

 const search=String(q||'').trim().toLowerCase();
 const byId=new Set(local.map(x=>x.id));
 const merged=[...local,...remote.filter(x=>!byId.has(x.id)).map(x=>({...x,summary:'需联网查看说明；尚未核对《朱／紫》版本适用性。',source:'https://pokeapi.co/docs/v2',remote:true}))];
 return merged.filter(x=>!search||[x.id,x.zh,x.summary,...(x.aliases||[])].some(y=>String(y).toLowerCase().includes(search)));
}

function simulateCombo({pokemon='maushold',move='population-bomb',ability='technician',item='wide-lens',tera='none',target='normal'}={}){
 const owner=SIM_POKEMON.find(p=>p.id===pokemon), m=SIM_MOVES.find(x=>x.id===move);
 if(!owner||!m)return {supported:false,reason:'组合中的宝可梦或招式尚未纳入已核实的规则模拟。'};
 const legal=owner.moves.includes(m.id)&&(ability==='none'||owner.abilities.includes(ability));
 const warnings=[];
 if(!owner.moves.includes(m.id))warnings.push(`${owner.name}未收录可学习招式「${m.name}」，不可视作合法配招。`);
 if(ability!=='none'&&!owner.abilities.includes(ability))warnings.push(`${owner.name}不具备所选特性；下方仅为假设性公式结果。`);
 const tech=(ability==='technician'&&m.bp<=60)?1.5:1;
 const hugePower=ability==='huge-power'?2:1; // physical attack multiplier, not move base power
 const lifeOrb=item==='life-orb'?1.3:1;
 const perHit=m.bp*tech;
 const accuracy=Math.min(1,m.accuracy*(item==='wide-lens'?1.1:1));
 let dist=[],note='';
 if(m.kind==='sequential'&&item==='loaded-dice'){
  dist=[{hits:0,p:1-accuracy},...[4,5,6,7,8,9,10].map(n=>({hits:n,p:accuracy/7}))];
  note='机变骰子对鼠数儿仅作一次命中判定；命中后4～10击等概率（每个1/7）。';
 }else if(m.kind==='sequential'){
  dist=[{hits:0,p:1-accuracy}];
  for(let n=1;n<10;n++)dist.push({hits:n,p:Math.pow(accuracy,n)*(1-accuracy)});
  dist.push({hits:10,p:Math.pow(accuracy,10)});
  note='每击独立判定；连续一旦落空就停止。';
 }else if(m.kind==='standard-multihit'){
  const probs=item==='loaded-dice'?[[4,.5],[5,.5]]:[[2,.35],[3,.35],[4,.15],[5,.15]];
  dist=[{hits:0,p:1-accuracy},...probs.map(([hits,p])=>({hits,p:p*accuracy}))];

 }

 const maxHits=Math.max(...dist.map(x=>x.hits));
 const maxProbability=dist.find(x=>x.hits===maxHits)?.p||0;
 const modifier=stab(m.type,owner.types,tera);
 const typeMultiplier=typeFactor(m.type,[target]);
 const expectedIndex=expectedHits*perHit*modifier*typeMultiplier*hugePower*lifeOrb;
 if(typeMultiplier===0)warnings.push(`对${TYPE_NAME[target]||target}属性目标，${TYPE_NAME[m.type]}属性攻击通常免疫，伤害为0。`);

const scoreRisk=(candidate,boss)=>{
 if(!boss)return {max:null,weakMoves:[],unknown:true};
 const checks=boss.moves.filter(x=>x.type).map(m=>({name:m.zh,value:effectiveness(m.type,candidate.types,'none','').value}));
 const weakMoves=checks.filter(x=>x.value>=2).map(x=>`${x.name} ×${x.value}`);

function analyzeFiveStar({boss,tera='grass',ability='',stars=5,mode='solo',candidates=[],candidateLookup}={}){
 const verified=Number(stars)===5?VERIFIED_FIVE_STAR_BOSSES[boss?.en]:null;
 const naturalTypes=boss?.types||[];
 if(!naturalTypes.length||!tera||tera==='none'||tera==='stellar')return {error:'请先选择首领宝可梦及18种普通太晶属性。星晶太晶不能直接套用本模式。'};
 const attackTypes=['normal','fire','water','electric','grass','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'];
 const offensive=attackTypes.map(t=>({type:t,name:TYPE_NAME[t],...effectiveness(t,naturalTypes,tera,ability)}));
 const bestTypes=offensive.filter(x=>x.value>=2).sort((a,b)=>b.value-a.value);
 const nullTypes=offensive.filter(x=>x.value===0);
 // Cautious candidate ranking, not actual HP, win-rate, or precise Tera boss AI simulation.
 const result=[];
 for(const build of candidates.filter(x=>x.mode==='raid')){
  const p=candidateLookup(build.pokemon);if(!p)continue;
  const moveOptions=build.moves.map(id=>COMMON_MOVES[id]).filter(m=>m&&m.power&&m.category!=='status');
  const usable=moveOptions.map(m=>({zh:m.zh||m.name||m.id,type:m.type,id:m.id,match:effectiveness(m.type,naturalTypes,tera,ability).value})).filter(m=>m.match>0).sort((a,b)=>b.match-a.match);
  if(!usable.length)continue;
  const best=usable[0];const risk=scoreRisk(p,verified);
  const offensiveBonus=best.match>=2?3:best.match===1?0:-3;
  const riskPenalty=risk.max>=4?7:risk.max>=2?3:0;
  const sustainability=build.roles?.includes('持续回复')?1:0;
  const score=offensiveBonus-riskPenalty+sustainability;
  const comments=[];
  if(best.match>=2)comments.push(`${TYPE_NAME[best.type]}招式对${TYPE_NAME[tera]}太晶有${best.match}倍属性效果`);
  else comments.push(`已列招式对${TYPE_NAME[tera]}太晶仅${best.match}倍，建议核对其他可学招式`);
  if(risk.weakMoves.length)comments.push(`首领已核实的招式中，${risk.weakMoves.join('、')}会克制它`);
  if(!verified)comments.push('未核实这一首领的五星固定招式，无法确认防守安全性');
  result.push({build,p,score,best,risk,comments});
 }
 result.sort((a,b)=>b.score-a.score||a.build.pokemon.localeCompare(b.build.pokemon,'zh-CN'));
 return {verified,offensive,bestTypes,nullTypes,candidates:result.slice(0,6),mode,stars,ability,
  confidence:verified?'仅对已核实的普通五星首领招式做风险初筛；特性与动态机制尚需实战确认':'仅属性初筛：当前没有这只首领的已核实普通五星招式资料。',
  warning:'不是胜率预测或精确伤害模拟。没有计算等级、PP、具体能力值、AI行动、护盾伤害修正、状态效果、特殊特性与多人配合。'};
}

function showSuggestions(kind,text){
 const box=$(`#suggest-${kind}`);if(!box)return;
 const matches=matchingPokemon(text).slice(0,12);
 if(!matches.length){box.innerHTML='<div class="suggestion muted">没有匹配的离线名称；联网时可试英文名或图鉴编号。</div>';box.classList.remove('hidden');return;}
 box.innerHTML=matches.map(p=>`<button class="suggestion" data-action="pick" data-kind="${kind}" data-pick="${escapeHTML(p.zh)}"><span>${escapeHTML(p.zh)}</span><span>${escapeHTML(p.en)} #${p.id}</span></button>`).join('');box.classList.remove('hidden');

async function lookup(kind,input){
 const value=String(input??$(`#search-${kind}`)?.value??'').trim();if(!value)return;
 // A one-character Chinese fragment is not an API identifier. Never send it
 // to PokéAPI; on mobile this previously produced a misleading Load failed.
 const exact=localPokemon(value);
 const partials=matchingPokemon(value);
 if(!exact && /[\u3400-\u9fff]/.test(value) && partials.length && !partials.some(p=>p.zh===value)){
   state.status=`“${value}”匹配 ${partials.length} 个本地候选。请点击下方完整名称，或继续输入。`;
   state.statusError=false;
   showSuggestions(kind,value);
   return;
 }
 state.busy=true;state.status='';state.statusError=false;
 try{
  const p=await lookupPokemon(value);
  if(kind==='foe'){
   state.foe=p;state.foeQuery=p.zh;state.manual=false;state.foeAbility='';
   state.selectedAttackType='water';
  }else if(kind==='own'){
   state.own=p;state.ownQuery=p.zh;
   state.iv=Object.fromEntries(STAT_KEYS.map(k=>[k,31]));state.ev=Object.fromEntries(STAT_KEYS.map(k=>[k,0]));state.trainLog=[];state.trainCounts={battle:0,vitamin:0,feather:0};
  }else if(kind==='dex'){state.dexPoke=p;state.dexQuery=p.zh;}
  else if(kind==='breedA'||kind==='breedB'){state[kind]=p;state[kind+'Query']=p.zh;state[kind==='breedA'?'breedSexA':'breedSexB']=breedMeta(p)?.gender==='genderless'?'genderless':breedMeta(p)?.gender==='male'?'male':breedMeta(p)?.gender==='female'?'female':kind==='breedA'?'female':'male';}
  if(p.origin==='remote'&&!getMoveCatalog())state.status=`已查询到 ${p.zh} 的基础资料；如需完整招式候选排序，请到“数据与说明”同步招式目录。`;
 }catch(e){state.status=`查询失败：${e.message||e}。可先试内置宝可梦，或确认当前设备能够访问 PokéAPI。`;state.statusError=true;}
 finally{state.busy=false;render();}
}

async function lookupTeamSlot(slot,value){
 if(!Number.isInteger(slot)||slot<0||slot>=6)return;
 const q=String(value||'').trim();
 if(!q){state.myTeamSlots[slot]='';state.status='第'+(slot+1)+'个队伍位置已清空。';render();return;}
 state.busy=true;state.status='正在查找'+q+'（优先离线索引）…';state.statusError=false;render();
 try{
  const p=await lookupPokemon(q);
  if(!registerTeamPokemon(p))throw new Error('资料缺少属性或种族值，暂不能进行队伍计算');
  state.myTeamSlots[slot]=p.zh;
  // Bound to selected roster, not all fetched Pokémon. Persist only required fields.
  state.myTeamProfiles[p.en]={id:p.id,zh:p.zh,en:p.en,types:p.types,stats:p.stats,abilities:p.abilities||[],origin:p.origin};
  state.status=`第${slot+1}只已加入：${p.zh}。${p.origin?.includes('snapshot')||p.origin==='offline'?'本地已收录。':'联网取得基础资料；是否属于《朱／紫》可用形态仍需核对。'}`;
  state.statusError=false;
 }catch(e){state.status=`第${slot+1}只加入失败：${String(e.message||e)}；已保留原成员。`;state.statusError=true;}
 finally{state.busy=false;render();}
}

 if(a==='breed-swap'){[state.breedA,state.breedB]=[state.breedB,state.breedA];[state.breedAQuery,state.breedBQuery]=[state.breedBQuery,state.breedAQuery];[state.breedSexA,state.breedSexB]=[state.breedSexB,state.breedSexA];[state.breedItemA,state.breedItemB]=[state.breedItemB,state.breedItemA];render();return;}
 if(a==='breed-partner'){
  try{state.busy=true;const p=await lookupPokemon(btn.dataset.name);state.breedB=p;state.breedBQuery=p.zh;const m=breedMeta(p);
    state.breedSexB=m?.gender==='female'?'female':m?.gender==='male'?'male':m?.gender==='genderless'?'genderless':state.breedSexA==='female'?'male':'female';
    state.status='已载入'+p.zh+'。请检查双亲性别和携带道具。';state.statusError=false;
  }catch(e){state.status='无法加载该配对对象：'+e.message;state.statusError=true;}finally{state.busy=false;render();}return;
 }
 if(a==='breed-filter'){state.breedPartnerFilter=String($('#breed-partner-filter')?.value||'').trim();render();return;}
 if(a==='breed-sync-catalog'){
  if(state.busy)return;state.busy=true;state.status='正在同步蛋群、性别和本篇／DLC图鉴目录；首次需要网络…';render();
  try{const r=await loadBreedingCatalog();setBreedingCatalog(getBreedingCatalog());state.status=`已缓存 ${r.count} 种物种的蛋群／性别索引，其中 ${r.svCount} 种列入本篇及DLC三本地区图鉴。`;state.statusError=false;}
  catch(e){state.status='同步未完成：'+(e.message||e)+'。精选离线功能仍可使用。';state.statusError=true;}
  finally{state.busy=false;render();}return;
 }
 if(a==='breed-family-online'){
  if(state.busy)return;state.busy=true;state.status='正在补全双亲进化家族与后代名称…';state.statusError=false;render();
  try{
   const values=await Promise.all([resolveBreedingFamily(state.breedA),resolveBreedingFamily(state.breedB)]);
   state.breedA=values[0];state.breedB=values[1];
   state.status='已核对双亲进化家族；后代预测已更新。地区形态及特殊跨世代例外仍需具体核实。';
  }catch(e){state.status='进化家族联网核对失败：'+String(e.message||e)+'。已核实的离线家族仍可继续使用。';state.statusError=true;}
  finally{state.busy=false;render();}return;
 }
 if(a==='breed-online'){
  if(state.busy)return;state.busy=true;state.status='正在查询蛋群和性别资料…';render();
  try{const data=await Promise.all([enrichBreedingData(state.breedA),enrichBreedingData(state.breedB)]);state.breedA=data[0];state.breedB=data[1];state.status='已从 PokéAPI 获取双亲蛋群和性别资料。仍需确认它们在《朱／紫》中可用。';state.statusError=false;}
  catch(e){state.status='联网查询失败：'+String(e.message||e);state.statusError=true;}
  finally{state.busy=false;render();}return;
 }
 if(a==='to-breed'){state.breedA=state.dexPoke;state.breedAQuery=state.dexPoke.zh;state.breedSexA=breedMeta(state.dexPoke)?.gender==='genderless'?'genderless':'female';state.tab='breed';state.status='';render();window.scrollTo({top:0,behavior:'auto'});return;}
 if(a==='font-toggle'){state.fontLarge=!state.fontLarge;render();return;}
 if(a==='check-update'){
  if(location.protocol==='file:'){state.status='当前是本地文件版。请在发布后的 HTTPS 网站中检查更新。';state.statusError=false;render();return;}
  state.busy=true;state.status='正在检查新版本…';state.statusError=false;render();
  try{
   const response=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});
   if(!response.ok)throw new Error('服务器返回 '+response.status);
   const info=await response.json();
   const newer=String(info.version||'')!==APP_VERSION;
   state.updateAvailable=newer;
   state.status=newer?`服务器已发布 V${info.version}，点击“加载最新版本”进行更新。`:`当前已是 V${APP_VERSION}，未发现新的应用版本。`;
   const registration=await navigator.serviceWorker?.getRegistration?.();
   await registration?.update?.();
  }catch(error){state.status='检查更新失败：'+String(error.message||error)+'。可先确认网络连接；当前离线功能不受影响。';state.statusError=true;}
  finally{state.busy=false;render();}
  return;
 }
 if(a==='reload-update'){location.reload();return;}
 if(a==='lookup'){await lookup(btn.dataset.kind);return;}
 if(a==='lookup-move'){const v=String($('#move-search')?.value||'').trim();state.moveQuery=v;const m=findMove(v);state.selectedMove=m?.id||'';render();return;}
 if(a==='move-preset'){state.selectedMove=btn.dataset.move;state.moveQuery=findMove(state.selectedMove)?.zh||state.selectedMove;render();return;}
 if(a==='pick'){await lookup(btn.dataset.kind,btn.dataset.pick);return;}
 if(a==='quick-dex'){await lookup('dex',btn.dataset.name);return;}
 if(a==='evo-pick'){await lookup('dex',btn.dataset.name);return;}
 if(a==='preset'){preset(btn.dataset.example);return;}
 if(a==='select-attack-type'){
  state.selectedAttackType=btn.dataset.type;
  if(state.tab==='dex'){state.foe=state.dexPoke;state.foeQuery=state.foe.zh;state.foeTera='none';state.foeAbility='';state.tab='counter';}
  render();return;
 }
 if(a==='mode'){state.mode=btn.dataset.mode;render();return;}
 if(a==='reset-ev'){state.ev=Object.fromEntries(STAT_KEYS.map(k=>[k,0]));state.trainLog=[];state.trainCounts={battle:0,vitamin:0,feather:0};render();return;}
 if(a==='apply-plan'){state.showProjected=!state.showProjected;render();return;}
 if(a==='show-moves'){state.tab='counter';state.status='已带入培养对象，可以选择对手并比较候选招式。';render();window.scrollTo({top:0,behavior:'auto'});return;}
 if(a==='to-counter'||a==='to-training'){
  const p=state.dexPoke;
  if(a==='to-counter'){state.foe=p;state.foeQuery=p.zh;state.foeAbility='';state.foeTera='none';state.tab='counter';}
  else {if(state.own?.en!==p.en){state.ev=Object.fromEntries(STAT_KEYS.map(k=>[k,0]));state.trainLog=[];state.trainCounts={battle:0,vitamin:0,feather:0};}state.own=p;state.ownQuery=p.zh;state.tab='train';}
  state.status='';render();window.scrollTo({top:0,behavior:'auto'});return;
 }
 if(a==='sync-dir'||a==='sync-moves'||a==='evolution'){
  if(state.busy)return;state.busy=true;state.status='正在联网查询数据…';state.statusError=false;render();
  try{
   const result=a==='sync-dir'?await loadDirectory():a==='sync-moves'?await loadMoveCatalog():await lookupEvolution(state.dexPoke);
   if(a==='evolution'){state.evolutionOnline[state.dexPoke.en]=result;state.status='已获得在线进化链。请注意它可能包含其他世代或版本的进化方式。';}else state.status=`已同步 ${result.count} 条${a==='sync-dir'?'中文名称':'招式资料'}${result.cached?'（来自本地缓存）':''}。`;
  }catch(e){state.status=`联网失败：${e.message||e}。不影响离线属性计算。`;state.statusError=true;}
  finally{state.busy=false;render();}
 }
});
document.addEventListener('input',event=>{
 // Wait until Chinese/Japanese IME has committed the character on iOS.
 if(event.isComposing)return;
 const teamInput=event.target.closest('.team-lookup');if(teamInput){showTeamSuggestions(Number(teamInput.dataset.teamQuery),teamInput.value);return;}
 const inp=event.target.closest('.pk-search');if(!inp)return;
 const kind=inp.dataset.search;
 state[({foe:'foeQuery',own:'ownQuery',dex:'dexQuery',breedA:'breedAQuery',breedB:'breedBQuery'})[kind]||'dexQuery']=inp.value;
 showSuggestions(kind,inp.value);
});
document.addEventListener('compositionend',event=>{
 const inp=event.target.closest('.pk-search');
 if(inp)showSuggestions(inp.dataset.search,inp.value);
 const team=event.target.closest('.team-lookup');
 if(team)showTeamSuggestions(Number(team.dataset.teamQuery),team.value);
});
document.addEventListener('keydown',async event=>{
 if(event.isComposing||event.keyCode===229)return;
 const inp=event.target.closest('.pk-search');if(event.target.id==='breed-partner-filter'&&event.key==='Enter'){event.preventDefault();state.breedPartnerFilter=event.target.value.trim();render();return;}if(event.target.classList?.contains('team-lookup')&&event.key==='Enter'){event.preventDefault();await lookupTeamSlot(Number(event.target.dataset.teamQuery),event.target.value);return;}if(event.target.id==='raid-boss-search'&&event.key==='Enter'){event.preventDefault();document.querySelector('[data-action=raid-boss-lookup]')?.click();return;}if(event.target.id==='evo-search'&&event.key==='Enter'){event.preventDefault();state.evoQuery=event.target.value.trim();state.evoMore=false;render();return;}if(event.target.id==='ref-search'&&event.key==='Enter'){event.preventDefault();state.refQuery=event.target.value.trim();state.refSelected='';state.refExpanded=false;render();return;}if(event.target.id==='item-search'&&event.key==='Enter'){event.preventDefault();state.itemQuery=event.target.value.trim();state.itemSelected=searchItemGuides(state.itemQuery,state.itemCategory,state.itemRegion)[0]?.id||'';render();return;}if(event.target.id==='material-search'&&event.key==='Enter'){event.preventDefault();state.materialQuery=event.target.value.trim();const found=searchMaterials(state.materialQuery);state.selectedMaterial=found.materials[0]?.id||'';state.materialTarget=getMaterial(state.selectedMaterial)?.tradeFor?.quantity||3;render();return;}if(event.target.id==='move-search'&&event.key==='Enter'){event.preventDefault();state.moveQuery=event.target.value;state.selectedMove=findMove(state.moveQuery)?.id||'';render();return;}if(inp&&event.key==='Enter'){event.preventDefault();await lookup(inp.dataset.search);}
 if(inp&&event.key==='Escape'){const box=$('#suggest-'+inp.dataset.search);box?.classList.add('hidden');}
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.dataset.teamSlot!==undefined){const slot=Number(el.dataset.teamSlot);if(Number.isInteger(slot)&&slot>=0&&slot<6){state.myTeamSlots[slot]=el.value;render();}return;}
 if(el.dataset.field){
  const key=el.dataset.field;
  if(key==='manual'||key==='ignoreAbility'||key==='breedHADonor')state[key]=el.checked;
  else if(key==='materialOwned')state.materialOwned=safeNum(el.value,0,9999);
  else if(key==='materialTarget')state.materialTarget=safeNum(el.value,1,9999);
  else if(key==='level')state.level=safeNum(el.value,1,100);
  else if(key==='itemCategory'||key==='itemRegion'){state.itemShowAll=false;state[key]=el.value;const found=searchItemGuides(state.itemQuery,state.itemCategory,state.itemRegion);state.itemSelected=found[0]?.id||'';}
  else if(key==='raidBossKey'){state.raidBossKey=el.value;state.raidBossCustom=null;state.raidBossQuery=VERIFIED_FIVE_STAR_BOSSES[el.value]?.zh||'';}
  else if(key==='recType'||key==='recRole'){state[key]=el.value;state.recTarget='';state.recShowAll=false;}
  else if(key==='trainTarget')state.trainTarget=safeNum(el.value,0,252);
  else if(key==='selectedMove'){state.selectedMove=el.value;state.selectedAttackType=COMMON_MOVES[el.value]?.type||state.selectedAttackType;}
  else state[key]=el.value;
  // Avoid same-type manual double counting by rejecting duplicate type choice.
  if(state.manual&&state.manualType1===state.manualType2)state.manualType2='';
  state.status='';render();return;
 }
 if(el.dataset.kind&&el.dataset.stat){
  const kind=el.dataset.kind,key=el.dataset.stat;
  const max=kind==='iv'?31:252;let value=safeNum(el.value,0,max);
  if(kind==='ev'){
   const others=STAT_KEYS.filter(k=>k!==key).reduce((s,k)=>s+(Number(state.ev[k])||0),0);
   value=Math.min(value,Math.max(0,510-others));
  }
  state[kind][key]=value;
  if(kind==='ev'){state.trainLog=[];state.trainCounts={battle:0,vitamin:0,feather:0};}
  state.status='';render();
 }
});
document.addEventListener('click',event=>{
 if(!event.target.closest('.search-wrap'))document.querySelectorAll('.suggestions').forEach(x=>x.classList.add('hidden'));
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='TERA_CACHE_COUNT'){state.teraIconsCached=Number(event.data.count)||0;if(state.tab==='crystal')render();}if(event.data?.type==='SV_TYPE_CACHE_COUNT'){state.svTypeIconsCached=Number(event.data.count)||0;if(state.tab==='type-guide')render();}});
 navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(reg=>{const worker=reg.active||navigator.serviceWorker.controller;worker?.postMessage({type:'CACHE_TERA_ICONS'});worker?.postMessage({type:'CACHE_SV_TYPE_ICONS'});}).catch(()=>{});
}
render();
// The 1.2 snapshot is published with the PWA and cached by its Service Worker.
// A missing/corrupt snapshot never destroys existing curated offline functionality.
if(location.protocol.startsWith('http')||document.getElementById?.('sv-offline-snapshot'))initSVSnapshot().then(()=>{
 setBreedingCatalog(getBreedingCatalog());
 // Never tear down the active mobile input while the keyboard is composing.
 const active=document.activeElement;
 if(active?.matches?.('.pk-search,.team-lookup')){
   if(active.classList.contains('pk-search'))showSuggestions(active.dataset.search,active.value);
   else showTeamSuggestions(Number(active.dataset.teamQuery),active.value);
 }else render();
});

} catch (error) {
  console.error('太晶战术图鉴启动失败',error);
  var root = document.getElementById('app');
  if(root) root.innerHTML='<div style="max-width:600px;margin:12vh auto;padding:28px;font-family:sans-serif"><h2>启动出现问题</h2><p>请升级浏览器或检查文件是否完整。</p><p style="color:#64748b;word-break:break-all">'+String(error.message||error).replace(/</g,'&lt;')+'</p></div>';
}
</script>
